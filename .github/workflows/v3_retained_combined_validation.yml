name: Validate V3 Combined Retained Features

on:
  pull_request:
    paths:
      - "v3/features/build_retained_features.py"
      - "v3/evaluation/retained_combined_ablation.py"
      - "v3/tests/test_retained_combined.py"
      - ".github/workflows/v3_retained_combined_validation.yml"

permissions:
  contents: read

concurrency:
  group: fear-greed-v3-retained-combined-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run combined-set tests
        run: python -m unittest -v v3.tests.test_retained_combined
      - name: Run fixed-as-of combined ablation
        run: python v3/evaluation/retained_combined_ablation.py
      - name: Verify frozen v2.1 baseline
        run: |
          python v3/baseline/freeze_v2_1.py
          git diff --exit-code -- reports/baseline_v2_1/
      - name: Upload combined evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-retained-combined-${{ github.run_id }}
          path: |
            v3/reports/retained_combined*.json
            v3/reports/retained_combined*.csv
            reports/baseline_v2_1/
          if-no-files-found: warn
          retention-days: 90
