name: Preserve Rebuilt V3 Integrity Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/v3_integrity_preserve.yml"

permissions:
  contents: write

jobs:
  preserve:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/v3-integrity-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repair branch head
        uses: actions/checkout@v4
        with:
          ref: agent/v3-integrity-repair

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild validated evidence
        run: python v3/ci/rebuild_integrity_evidence.py

      - name: Commit reviewed immutable evidence and self-remove
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            v3/data/dollar_daily.csv \
            v3/data/dollar_source.json \
            v3/reports/integrity_rebuild_summary.json \
            v3/reports/feature_registry_relative_strength.json \
            v3/reports/relative_strength_features_missingness.json \
            v3/reports/relative_strength_ablation.json \
            v3/reports/relative_strength_ablation_comparison.csv \
            v3/reports/relative_strength_ablation_lane_summary.csv \
            v3/reports/relative_strength_ablation_tournament.csv \
            v3/reports/relative_strength_result_REJECT.txt \
            v3/reports/feature_registry_treasury.json \
            v3/reports/treasury_features_missingness.json \
            v3/reports/dataset_validation_treasury.json \
            v3/reports/treasury_ablation.json \
            v3/reports/treasury_ablation_comparison.csv \
            v3/reports/treasury_ablation_lane_summary.csv \
            v3/reports/treasury_ablation_tournament.csv \
            v3/reports/treasury_result_KEEP.txt \
            v3/reports/feature_registry_dollar.json \
            v3/reports/dollar_features_missingness.json \
            v3/reports/dataset_validation_dollar.json \
            v3/reports/dollar_ablation.json \
            v3/reports/dollar_ablation_comparison.csv \
            v3/reports/dollar_ablation_lane_summary.csv \
            v3/reports/dollar_ablation_tournament.csv \
            v3/reports/dollar_result_REJECT.txt \
            v3/reports/feature_registry_retained_combined.json \
            v3/reports/retained_combined_features_missingness.json \
            v3/reports/retained_combined_ablation.json \
            v3/reports/retained_combined_ablation_comparison.csv \
            v3/reports/retained_combined_ablation_lane_summary.csv \
            v3/reports/retained_combined_ablation_tournament.csv \
            v3/reports/retained_combined_family_context.csv \
            v3/reports/retained_combined_result_REJECT.txt \
            v3/reports/decision_policy_manifest.json \
            v3/reports/decision_policy_result_PASS.txt \
            v3/reports/sizing_policy_manifest.json \
            v3/reports/sizing_policy_result_PASS.txt

          git rm .github/workflows/v3_integrity_preserve.yml
          git commit -m "Preserve corrected V3 integrity evidence"
          git push origin HEAD:agent/v3-integrity-repair
