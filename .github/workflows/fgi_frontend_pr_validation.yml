name: Validate FGI React on Existing GitHub Pages Path

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/publish_react_dashboard.py'
      - 'scripts/validate_react_publication.py'
      - 'scripts/check_live_pages.py'
      - 'tests/test_react_publication.py'
      - 'tests/test_same_site_health.py'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/fgi_frontend_pr_validation.yml'
      - '.agent/**'

permissions:
  contents: read

concurrency:
  group: fgi-react-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out PR (read-only)
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify landing URL and publication contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify existing dashboard/test semantics
        run: python -m unittest -v test_dashboard test_v3_challenger v3.tests.test_shadow_predictions
      - name: Rebuild original published data
        run: |
          python scripts/build_dashboard.py --skip-yahoo-fallback
          python -m v3.features.build_features
          python -m v3.labels.build_labels
          python -m v3.evaluation.validate_dataset
          python -m v3.ci.run_treasury_feature_stage
          python -m v3.evidence.verify_forward_lane
          python -m v3.evidence.shadow_predictions verify
          python scripts/build_v3_challenger.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, test and compile React
        working-directory: frontend
        run: |
          npm ci
          npm run test
          npm run build
      - name: Publish preview artifact to site/index.html (no deployment)
        run: |
          python scripts/publish_react_dashboard.py
          python scripts/validate_react_publication.py
      - name: Test real browser on desktop and mobile
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload candidate Pages artifact (never deploy PR)
        uses: actions/upload-artifact@v4
        with:
          name: fgi-react-preview-${{ github.run_id }}
          path: site/
          retention-days: 7
