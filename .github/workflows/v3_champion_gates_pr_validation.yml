name: Validate V3 Champion Gates

on:
  pull_request:
    paths:
      - "v3/evaluation/champion_gates_v1.json"
      - "v3/evaluation/champion_gates.py"
      - "v3/evaluation/build_current_champion_evidence.py"
      - "v3/evaluation/build_champion_gate_manifest.py"
      - "v3/ci/run_champion_gate_stage.py"
      - "v3/tests/test_champion_gates.py"
      - ".github/workflows/v3_champion_gates_pr_validation.yml"

permissions:
  contents: read

concurrency:
  group: fear-greed-v3-champion-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_champion_gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run V3-018 gate tests
        run: python -m unittest -v v3.tests.test_champion_gates

      - name: Evaluate current retained candidate
        run: python -m v3.ci.run_champion_gate_stage

      - name: Verify frozen v2.1 benchmark
        run: |
          python -m v3.baseline.freeze_v2_1
          git diff --exit-code -- reports/baseline_v2_1/

      - name: Upload V3-018 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-champion-gates-${{ github.run_id }}
          path: |
            v3/reports/champion_gate_manifest.json
            v3/reports/champion_candidate_evidence.json
            v3/reports/champion_gate_assessment.json
          if-no-files-found: warn
          retention-days: 90
