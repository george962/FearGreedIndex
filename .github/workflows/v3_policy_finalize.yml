name: Finalize V3 Decision Policy Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/v3_policy_finalize.yml"
      - "v3/policy/**"
      - "v3/tests/test_decision_policy.py"

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run V3-016 tests
        run: python -m unittest -v v3.tests.test_decision_policy
      - name: Build policy manifest
        run: python v3/policy/build_policy_manifest.py
      - name: Verify frozen v2.1 benchmark
        run: |
          python v3/baseline/freeze_v2_1.py
          git diff --exit-code -- reports/baseline_v2_1/
      - name: Create PASS marker
        run: |
          printf '%s\n' \
            'status=PASS' \
            'policy_version=v3-decision-policy-001' \
            'research_only=true' \
            'sizing_defined=false' \
            'sell_or_underweight_allowed=false' \
            > v3/reports/decision_policy_result_PASS.txt
      - name: Commit evidence and self-remove
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/reports/decision_policy_manifest.json v3/reports/decision_policy_result_PASS.txt
          git rm .github/workflows/v3_policy_finalize.yml
          git commit -m "Preserve V3-016 policy evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
