name: Finalize V3 Minimal Sizing Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/v3_sizing_finalize.yml"
      - "v3/policy/sizing_v1.json"
      - "v3/policy/sizing_policy.py"
      - "v3/tests/test_sizing_policy.py"

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run sizing tests
        run: python -m unittest -v v3.tests.test_sizing_policy
      - name: Build sizing manifest
        run: python v3/policy/build_sizing_manifest.py
      - name: Verify frozen v2.1 benchmark
        run: |
          python v3/baseline/freeze_v2_1.py
          git diff --exit-code -- reports/baseline_v2_1/
      - name: Record gate status
        run: |
          printf '%s\n' \
            'status=PASS' \
            'sizing_version=v3-sizing-policy-001' \
            'current_candidate_multiplier=1.00' \
            'promotion_gate_required=true' \
            'empirical_1_10x_test=BLOCKED_UNTIL_PREDICTION_PROMOTION' \
            > v3/reports/sizing_policy_result_PASS.txt
      - name: Commit evidence and self-remove
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/reports/sizing_policy_manifest.json v3/reports/sizing_policy_result_PASS.txt
          git rm .github/workflows/v3_sizing_finalize.yml
          git commit -m "Preserve V3-017 sizing gate evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
