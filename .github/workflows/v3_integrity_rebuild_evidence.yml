name: Rebuild V3 Integrity Evidence

on:
  push:
    branches:
      - agent/v3-integrity-repair
    paths:
      - ".github/workflows/v3_integrity_rebuild_evidence.yml"

permissions:
  contents: write

concurrency:
  group: v3-integrity-rebuild-agent-v3-integrity-repair
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.ref == 'refs/heads/agent/v3-integrity-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/v3-integrity-repair

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run complete V3 unit suite
        run: python -m unittest discover -s v3/tests -p "test_*.py" -v

      - name: Rebuild baseline feature and label datasets
        run: |
          python v3/features/build_features.py
          python v3/labels/build_labels.py
          python v3/evaluation/validate_dataset.py

      - name: Revalidate V3-013 relative strength
        run: python v3/evaluation/relative_strength_ablation.py

      - name: Revalidate V3-015A Treasury
        run: |
          python v3/ci/run_treasury_feature_stage.py
          python v3/evaluation/treasury_ablation.py

      - name: Revalidate V3-015B broad dollar
        run: |
          python v3/ci/run_dollar_feature_stage.py
          python v3/evaluation/dollar_ablation.py

      - name: Revalidate V3-015C retained combined set
        run: python v3/evaluation/retained_combined_ablation.py

      - name: Revalidate V3-016 policy and V3-017 sizing
        run: |
          python -m unittest -v v3.tests.test_decision_policy
          python v3/policy/build_policy_manifest.py
          python -m unittest -v v3.tests.test_sizing_policy
          python v3/policy/build_sizing_manifest.py

      - name: Create measured result markers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          specs = [
              ("relative_strength", "relative_strength_ablation.json", "retain_relative_strength"),
              ("treasury", "treasury_ablation.json", "retain_treasury"),
              ("dollar", "dollar_ablation.json", "retain_dollar"),
              ("retained_combined", "retained_combined_ablation.json", "retain_combined"),
          ]
          reports = Path("v3/reports")
          for prefix, report_name, key in specs:
              report = json.loads((reports / report_name).read_text(encoding="utf-8"))
              decision = report["feature_family_decision"]
              keep = bool(decision[key])
              marker = reports / f"{prefix}_result_{'KEEP' if keep else 'REJECT'}.txt"
              opposite = reports / f"{prefix}_result_{'REJECT' if keep else 'KEEP'}.txt"
              if opposite.exists():
                  opposite.unlink()
              marker.write_text(
                  "\n".join([
                      f"decision={decision['decision']}",
                      f"robust_lane_count={decision['robust_lane_count']}",
                      f"sample_hashes_match={report['sample_hashes_match']}",
                      f"best_ranked_full_candidate={report['best_ranked_full_candidate_in_ablation_tournament']}",
                      f"promotion_ready={report['promotion_ready_experiments_from_absolute_gates']}",
                      f"ablation_as_of={report['ablation_as_of']}",
                  ]) + "\n",
                  encoding="utf-8",
              )
              print(marker.read_text(encoding="utf-8"))

          (reports / "decision_policy_result_PASS.txt").write_text(
              "status=PASS\npolicy_version=v3-decision-policy-001\nresearch_only=true\nsizing_defined=false\nsell_or_underweight_allowed=false\n",
              encoding="utf-8",
          )
          (reports / "sizing_policy_result_PASS.txt").write_text(
              "status=PASS\nsizing_version=v3-sizing-policy-001\ncurrent_candidate_multiplier=1.00\npromotion_gate_required=true\nempirical_1_10x_test=BLOCKED_UNTIL_PREDICTION_PROMOTION\n",
              encoding="utf-8",
          )
          PY

      - name: Verify frozen v2.1 benchmark
        run: |
          python v3/baseline/freeze_v2_1.py
          git diff --exit-code -- reports/baseline_v2_1/

      - name: Commit regenerated immutable evidence and self-remove
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v3/data/dollar_daily.csv \
            v3/data/dollar_source.json \
            v3/reports/feature_registry_relative_strength.json \
            v3/reports/relative_strength_features_missingness.json \
            v3/reports/relative_strength_ablation.json \
            v3/reports/relative_strength_ablation_comparison.csv \
            v3/reports/relative_strength_ablation_lane_summary.csv \
            v3/reports/relative_strength_ablation_tournament.csv \
            v3/reports/relative_strength_result_*.txt \
            v3/reports/feature_registry_treasury.json \
            v3/reports/treasury_features_missingness.json \
            v3/reports/dataset_validation_treasury.json \
            v3/reports/treasury_ablation.json \
            v3/reports/treasury_ablation_comparison.csv \
            v3/reports/treasury_ablation_lane_summary.csv \
            v3/reports/treasury_ablation_tournament.csv \
            v3/reports/treasury_result_*.txt \
            v3/reports/feature_registry_dollar.json \
            v3/reports/dollar_features_missingness.json \
            v3/reports/dataset_validation_dollar.json \
            v3/reports/dollar_ablation.json \
            v3/reports/dollar_ablation_comparison.csv \
            v3/reports/dollar_ablation_lane_summary.csv \
            v3/reports/dollar_ablation_tournament.csv \
            v3/reports/dollar_result_*.txt \
            v3/reports/feature_registry_retained_combined.json \
            v3/reports/retained_combined_features_missingness.json \
            v3/reports/retained_combined_ablation.json \
            v3/reports/retained_combined_ablation_comparison.csv \
            v3/reports/retained_combined_ablation_lane_summary.csv \
            v3/reports/retained_combined_ablation_tournament.csv \
            v3/reports/retained_combined_family_context.csv \
            v3/reports/retained_combined_result_*.txt \
            v3/reports/decision_policy_manifest.json \
            v3/reports/decision_policy_result_PASS.txt \
            v3/reports/sizing_policy_manifest.json \
            v3/reports/sizing_policy_result_PASS.txt

          rm -f .github/workflows/v3_integrity_rebuild_evidence.yml
          git add -A .github/workflows
          git commit -m "Rebuild missing V3 evidence under current code"
          git push origin HEAD:agent/v3-integrity-repair
