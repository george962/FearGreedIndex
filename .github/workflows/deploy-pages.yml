name: Build and deploy market dashboard

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "30 23 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show repository structure
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          find . -maxdepth 4 -type f | sort

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "requirements.txt"
            "config.json"
            "data/fear_greed.tsv"
            "scripts/build_dashboard.py"
            "scripts/update_fear_greed.py"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required file is missing: $file"
              exit 1
            fi
          done

          echo "All required files are present."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show Python version
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Optionally refresh Fear and Greed data
        env:
          FEAR_GREED_SOURCE_URL: ${{ secrets.FEAR_GREED_SOURCE_URL }}
        run: |
          python scripts/update_fear_greed.py

      - name: Build dashboard
        run: |
          python scripts/build_dashboard.py

      - name: Verify generated website
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "site/index.html" ]]; then
            echo "::error::site/index.html was not generated."
            exit 1
          fi

          if [[ ! -f "site/version.json" ]]; then
            echo "::error::site/version.json was not generated."
            exit 1
          fi

          echo "Generated site files:"
          find site -maxdepth 2 -type f -printf "%p %k KB\n" | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    name: Deploy dashboard
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
