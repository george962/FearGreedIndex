name: Validate V3 Dollar Research

on:
  pull_request:
    paths:
      - "v3/data_sources/fetch_dollar.py"
      - "v3/features/dollar_features.json"
      - "v3/features/build_dollar_features.py"
      - "v3/evaluation/dollar_ablation.py"
      - "v3/ci/run_dollar_feature_stage.py"
      - "v3/tests/test_dollar_*.py"
      - "v3/data/dollar_daily.csv"
      - "v3/data/dollar_source.json"
      - ".github/workflows/v3_dollar_pr_validation.yml"

permissions:
  contents: read

concurrency:
  group: fear-greed-v3-dollar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_dollar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run dollar tests
        run: python -m unittest discover -s v3/tests -p "test_dollar_*.py" -v
      - name: Build baseline features and labels
        run: |
          python -m v3.features.build_features
          python -m v3.labels.build_labels
          python -m v3.evaluation.validate_dataset
      - name: Build and validate dollar features
        run: python -m v3.ci.run_dollar_feature_stage
      - name: Run fixed-as-of dollar ablation
        run: python -m v3.evaluation.dollar_ablation
      - name: Verify frozen v2.1 baseline
        run: |
          python -m v3.baseline.freeze_v2_1
          git diff --exit-code -- reports/baseline_v2_1/
      - name: Upload dollar evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-dollar-evidence-${{ github.run_id }}
          path: |
            v3/data/dollar_daily.csv
            v3/data/dollar_source.json
            v3/reports/feature_registry_dollar.json
            v3/reports/dollar_features_missingness.json
            v3/reports/dataset_validation_dollar.json
            v3/reports/dollar_ablation*.json
            v3/reports/dollar_ablation*.csv
            reports/baseline_v2_1/
          if-no-files-found: warn
          retention-days: 90
