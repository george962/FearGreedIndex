name: Validate V3 Treasury Research

on:
  pull_request:
    paths:
      - "v3/data_sources/fetch_treasury.py"
      - "v3/features/treasury_features.json"
      - "v3/features/build_treasury_features.py"
      - "v3/evaluation/treasury_ablation.py"
      - "v3/ci/run_treasury_feature_stage.py"
      - "v3/tests/test_treasury_*.py"
      - "v3/data/treasury_daily.csv"
      - "v3/data/treasury_source.json"
      - ".github/workflows/v3_treasury_pr_validation.yml"

permissions:
  contents: read

concurrency:
  group: fear-greed-v3-treasury-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_treasury:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Treasury unit tests
        run: python -m unittest discover -s v3/tests -p "test_treasury_*.py" -v

      - name: Build and validate Treasury feature family
        run: python v3/ci/run_treasury_feature_stage.py

      - name: Run Treasury controlled ablation when implemented
        run: |
          if [ -f v3/evaluation/treasury_ablation.py ]; then
            python v3/evaluation/treasury_ablation.py
          else
            echo "Treasury ablation not implemented yet."
          fi

      - name: Freeze v2.1 baseline guard
        run: python v3/baseline/freeze_v2_1.py

      - name: Verify frozen baseline is reproducible
        run: git diff --exit-code -- reports/baseline_v2_1/

      - name: Upload Treasury evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-treasury-evidence-${{ github.run_id }}
          path: |
            v3/data/treasury_daily.csv
            v3/data/treasury_source.json
            v3/data/features_daily_treasury.parquet
            v3/data/model_dataset_treasury.parquet
            v3/reports/feature_registry_treasury.json
            v3/reports/treasury_features_missingness.json
            v3/reports/dataset_validation_treasury.json
            v3/reports/treasury_ablation*.json
            v3/reports/treasury_ablation*.csv
            reports/baseline_v2_1/
          if-no-files-found: warn
          retention-days: 90
