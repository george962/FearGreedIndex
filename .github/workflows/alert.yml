name: CNN Fear and Greed Monitor

run-name: Check CNN Fear and Greed Index

on:

  schedule:
    # Runs hourly at minute 30, Monday-Friday.
    # GitHub cron uses UTC.
    - cron: "30 11-22 * * 1-5"

permissions:
  contents: read
  issues: write

concurrency:
  group: cnn-fear-and-greed-monitor
  cancel-in-progress: false

jobs:
  check-fear-and-greed:
    name: Check Fear and Greed Index
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install certifi

      - name: Get Fear and Greed Index
        id: feargreed
        run: |
          python FearGreed.py \
            --github-output \
            --low 25 \
            --high 75

      - name: Show result
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Date: ${{ steps.feargreed.outputs.date }}"
          echo "Value: ${{ steps.feargreed.outputs.value }}"
          echo "Rating: ${{ steps.feargreed.outputs.rating }}"
          echo "Alert type: ${{ steps.feargreed.outputs.alert_type }}"

      - name: Process alert notification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_TYPE: ${{ steps.feargreed.outputs.alert_type }}
          CURRENT_VALUE: ${{ steps.feargreed.outputs.value }}
          CURRENT_RATING: ${{ steps.feargreed.outputs.rating }}
          CURRENT_DATE: ${{ steps.feargreed.outputs.date }}
          LOW_THRESHOLD: "25"
          HIGH_THRESHOLD: "75"
          MOVE_ALERT_SIZE: "5"
          ASSIGNEE: "george962"

        run: |
          set -euo pipefail

          find_exact_issue() {
            local title="$1"
            local state="$2"

            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state "$state" \
              --limit 100 \
              --search "\"$title\" in:title" \
              --json number,title,state |
              jq -r \
                --arg exact_title "$title" \
                'map(select(.title == $exact_title))[0].number // empty'
          }

          close_open_issue() {
            local title="$1"
            local issue_number

            issue_number="$(find_exact_issue "$title" "open")"

            if [ -n "$issue_number" ]; then
              gh issue close "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "$(cat <<EOF
          ## Index returned to the normal range

          - **Current value:** $CURRENT_VALUE
          - **Rating:** $CURRENT_RATING
          - **Data date:** $CURRENT_DATE

          Future alerts will continue in this same issue.
          EOF
          )"
            fi
          }

          if [ "$ALERT_TYPE" = "normal" ]; then
            close_open_issue "Fear & Greed LOW Alert"
            close_open_issue "Fear & Greed HIGH Alert"

            echo "Index is normal. Any active alert issues were closed."
            exit 0
          fi

          if [ "$ALERT_TYPE" = "low" ]; then
            ISSUE_TITLE="Fear & Greed LOW Alert"
            THRESHOLD_NAME="Low threshold"
            THRESHOLD_VALUE="$LOW_THRESHOLD"
            DIRECTION_DESCRIPTION="at or below"
          elif [ "$ALERT_TYPE" = "high" ]; then
            ISSUE_TITLE="Fear & Greed HIGH Alert"
            THRESHOLD_NAME="High threshold"
            THRESHOLD_VALUE="$HIGH_THRESHOLD"
            DIRECTION_DESCRIPTION="at or above"
          else
            echo "Unexpected alert type: $ALERT_TYPE"
            exit 1
          fi

          ISSUE_NUMBER="$(find_exact_issue "$ISSUE_TITLE" "all")"
          ISSUE_WAS_CREATED="false"
          ISSUE_WAS_CLOSED="false"

          CURRENT_MARKER="<!-- feargreed-state:$ALERT_TYPE:$CURRENT_DATE:$CURRENT_VALUE -->"

          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_URL="$(
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --assignee "$ASSIGNEE" \
                --body "$(cat <<EOF
          $CURRENT_MARKER

          ## Permanent CNN Fear & Greed alert issue

          This issue receives all **$ALERT_TYPE** Fear & Greed notifications.

          ### Latest notified reading

          - **Current value:** $CURRENT_VALUE
          - **Rating:** $CURRENT_RATING
          - **Data date:** $CURRENT_DATE
          - **$THRESHOLD_NAME:** $THRESHOLD_VALUE

          The index is $DIRECTION_DESCRIPTION the configured threshold.

          Another same-day notification is sent only when the index moves
          at least **$MOVE_ALERT_SIZE points** from the last notified value.
          A new notification is also sent on the next data date.
          EOF
          )"
            )"

            ISSUE_NUMBER="${ISSUE_URL##*/}"
            ISSUE_WAS_CREATED="true"

            echo "Created permanent issue #$ISSUE_NUMBER."
          else
            ISSUE_STATE="$(
              gh issue view "$ISSUE_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --json state \
                --jq '.state'
            )"

            if [ "$ISSUE_STATE" = "CLOSED" ]; then
              gh issue reopen "$ISSUE_NUMBER" \
                --repo "$GITHUB_REPOSITORY"

              ISSUE_WAS_CLOSED="true"
              echo "Reopened permanent issue #$ISSUE_NUMBER."
            fi
          fi

          if [ "$ISSUE_WAS_CREATED" = "true" ]; then
            echo "Initial notification was delivered through issue creation."
            exit 0
          fi

          ISSUE_BODY="$(
            gh issue view "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json body \
              --jq '.body'
          )"

          LAST_MARKER="$(
            printf '%s\n' "$ISSUE_BODY" |
              grep -oE \
                '<!-- feargreed-state:(low|high):[0-9]{4}-[0-9]{2}-[0-9]{2}:[0-9]+([.][0-9]+)? -->' |
              tail -n 1 ||
              true
          )"

          LAST_DATE=""
          LAST_VALUE=""

          if [ -n "$LAST_MARKER" ]; then
            STATE_DATA="$(
              printf '%s\n' "$LAST_MARKER" |
                sed -E \
                  's/<!-- feargreed-state:(low|high):([0-9]{4}-[0-9]{2}-[0-9]{2}):([0-9]+([.][0-9]+)?) -->/\2 \3/'
            )"

            LAST_DATE="$(
              printf '%s\n' "$STATE_DATA" |
                awk '{print $1}'
            )"

            LAST_VALUE="$(
              printf '%s\n' "$STATE_DATA" |
                awk '{print $2}'
            )"
          fi

          SEND_NOTIFICATION="false"
          NOTIFICATION_REASON=""

          if [ "$ISSUE_WAS_CLOSED" = "true" ]; then
            SEND_NOTIFICATION="true"
            NOTIFICATION_REASON="The index entered the $ALERT_TYPE range again."
          elif [ -z "$LAST_DATE" ] || [ -z "$LAST_VALUE" ]; then
            SEND_NOTIFICATION="true"
            NOTIFICATION_REASON="No previous notification state was found."
          elif [ "$CURRENT_DATE" != "$LAST_DATE" ]; then
            SEND_NOTIFICATION="true"
            NOTIFICATION_REASON="This is the first $ALERT_TYPE notification for $CURRENT_DATE."
          else
            ABSOLUTE_MOVE="$(
              awk \
                -v current="$CURRENT_VALUE" \
                -v previous="$LAST_VALUE" \
                'BEGIN {
                  difference = current - previous
                  if (difference < 0) {
                    difference = -difference
                  }
                  printf "%.6f", difference
                }'
            )"

            LARGE_MOVE="$(
              awk \
                -v movement="$ABSOLUTE_MOVE" \
                -v required="$MOVE_ALERT_SIZE" \
                'BEGIN {
                  if (movement >= required) {
                    print "true"
                  } else {
                    print "false"
                  }
                }'
            )"

            if [ "$LARGE_MOVE" = "true" ]; then
              SEND_NOTIFICATION="true"

              MOVE_DIRECTION="$(
                awk \
                  -v current="$CURRENT_VALUE" \
                  -v previous="$LAST_VALUE" \
                  'BEGIN {
                    if (current > previous) {
                      print "increased"
                    } else if (current < previous) {
                      print "decreased"
                    } else {
                      print "changed"
                    }
                  }'
              )"

              NOTIFICATION_REASON="$(
                printf \
                  'The index %s from %s to %s, a move of %s points.' \
                  "$MOVE_DIRECTION" \
                  "$LAST_VALUE" \
                  "$CURRENT_VALUE" \
                  "$ABSOLUTE_MOVE"
              )"
            fi
          fi

          if [ "$SEND_NOTIFICATION" != "true" ]; then
            echo "No notification needed."
            echo "Last notified date: $LAST_DATE"
            echo "Last notified value: $LAST_VALUE"
            echo "Current date: $CURRENT_DATE"
            echo "Current value: $CURRENT_VALUE"
            exit 0
          fi

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$(cat <<EOF
          ## $ALERT_TYPE alert notification

          - **Current value:** $CURRENT_VALUE
          - **Previous notified value:** ${LAST_VALUE:-None}
          - **Rating:** $CURRENT_RATING
          - **Data date:** $CURRENT_DATE
          - **$THRESHOLD_NAME:** $THRESHOLD_VALUE

          **Reason:** $NOTIFICATION_REASON
          EOF
          )"

          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$(cat <<EOF
          $CURRENT_MARKER

          ## Permanent CNN Fear & Greed alert issue

          This issue receives all **$ALERT_TYPE** Fear & Greed notifications.

          ### Latest notified reading

          - **Current value:** $CURRENT_VALUE
          - **Rating:** $CURRENT_RATING
          - **Data date:** $CURRENT_DATE
          - **$THRESHOLD_NAME:** $THRESHOLD_VALUE

          The index is $DIRECTION_DESCRIPTION the configured threshold.

          Another same-day notification is sent only when the index moves
          at least **$MOVE_ALERT_SIZE points** from this latest notified value.
          A new notification is also sent on the next data date.
          EOF
          )"

          echo "Notification added to issue #$ISSUE_NUMBER."
