name: Finalize STAB-001 Evidence

on:
  push:
    branches:
      - agent/stab-001-past-only-selection
    paths:
      - ".github/workflows/stab001_finalize.yml"

permissions:
  contents: write

concurrency:
  group: fear-greed-stab001-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
        with:
          ref: agent/stab-001-past-only-selection
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild frozen experiment inputs and result
        run: |
          python -m v3.features.build_features
          python -m v3.labels.build_labels
          python -m v3.evaluation.validate_dataset
          python -m v3.ci.run_treasury_feature_stage
          python -m v3.evaluation.exp006_opportunity
          python -m v3.evaluation.stab001_past_only

      - name: Freeze manifest, checkpoint, and status
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          manifest_path = root / 'v3/methodology/STAB-001/manifest.json'
          evaluation_path = root / 'v3/reports/stab001_evaluation.json'
          metrics_path = root / 'v3/reports/stab001_metrics.csv'
          selected_path = root / 'v3/reports/stab001_selected_features.csv'
          checkpoint_path = root / 'v3/checkpoints/STAB-001.md'
          status_path = root / 'v3/STATUS.md'

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          evaluation = json.loads(evaluation_path.read_text())
          manifest = json.loads(manifest_path.read_text())
          manifest['status'] = 'complete_reject'
          manifest['result'] = {
              'decision': evaluation['decision'],
              'method_viability_pass': evaluation['method_viability_pass'],
              **evaluation['viability'],
          }
          manifest['evidence'] = {
              'v3/reports/stab001_evaluation.json': sha(evaluation_path),
              'v3/reports/stab001_metrics.csv': sha(metrics_path),
              'v3/reports/stab001_selected_features.csv': sha(selected_path),
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')

          v = evaluation['viability']
          checkpoint_path.write_text(f'''# STAB-001 — Past-only relationship stability selection\n\n## Result\n\n**REJECT — `{evaluation['decision']}`**\n\nThe past-only selector found a materially better **ranking** signal, but the frozen training-CDF probability mapping failed the probability-quality gate.\n\n- mean ROC AUC: **{v['mean_roc_auc']:.6f}**\n- minimum fold AUC: **{v['minimum_fold_roc_auc']:.6f}**\n- AUC > 0.50 folds: **{v['positive_auc_folds']}/3**\n- feature-support folds: **{v['selection_support_folds']}/3**\n- family-support folds: **{v['family_support_folds']}/3**\n- mean relative Brier improvement: **{v['mean_relative_brier_improvement']:.6f}**\n- positive relative-Brier folds: **{v['positive_relative_brier_folds']}/3**\n- EXP-006 sample hashes matched: **{v['sample_hashes_match_exp006']}**\n\nFold AUCs are approximately **0.627 / 0.537 / 0.556** for 2024 / 2025 / 2026 YTD. This is the first post-DIAG methodology to produce AUC above 0.50 in all three exposed folds. However, Brier quality is worse than the legal training base-rate predictor in all three folds, so STAB-001 fails exactly as pre-registered.\n\n## Interpretation\n\nDo **not** call STAB-001 a passing model or use it for V3-019/sizing. The useful hypothesis generated by this frozen failure is narrower: **past-only relationship stability may recover ordering information, while the raw CDF-to-probability mapping is miscalibrated.** A causal calibration test requires a new methodology ID; STAB-001 thresholds may not be retuned.\n\n2024–2026 YTD remain development evidence only. EVID-001 outcomes were not opened.\n''')

          status = status_path.read_text()
          completed_anchor = '| EVID-001 Untouched post-DIAG forward evidence | COMPLETE — COLLECTION ACTIVE | issue #60 / PR #61; append-only point-in-time feature/Treasury ledgers beginning after `2026-08-18`; no outcomes open automatically |'
          stab_row = '| STAB-001 Past-only relationship stability selection | COMPLETE — REJECT / RANKING PROMISING | issue #62 / PR #63; mean AUC ~0.573 and AUC >0.50 in 3/3 folds, but relative Brier <0 in 3/3 folds |'
          if stab_row not in status:
              status = status.replace(completed_anchor, completed_anchor + '\n' + stab_row)
          status = status.replace(
              '3. Pre-register a **past-only stability-selection methodology** before training another DIAG-informed model. The selection rule must use only pre-fold training information; the exposed 2024–2026 folds are development evidence only.',
              '3. STAB-001 is frozen as a negative experiment with promising ranking but failed calibration. Pre-register a separate causal calibration methodology before any adaptive predictive model; do not retune STAB-001.'
          )
          status_path.write_text(status)
          PY

      - name: Commit immutable evidence and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            v3/reports/stab001_evaluation.json \
            v3/reports/stab001_metrics.csv \
            v3/reports/stab001_selected_features.csv
          git add \
            v3/methodology/STAB-001/manifest.json \
            v3/checkpoints/STAB-001.md \
            v3/STATUS.md
          git rm .github/workflows/stab001_finalize.yml
          git commit -m "Freeze STAB-001 negative evidence"
          git push origin HEAD:agent/stab-001-past-only-selection
