name: Validate EXP-006 Opportunity Target

on:
  pull_request:
    paths:
      - "v3/evaluation/exp006_opportunity.py"
      - "v3/ci/check_exp006_evidence.py"
      - "v3/tests/test_exp006_opportunity.py"
      - "v3/experiments/EXP-006/**"
      - "v3/checkpoints/EXP-006.md"
      - "v3/reports/exp006_evaluation.json"
      - "v3/reports/exp006_metrics.csv"
      - "v3/reports/exp006_state_distribution.csv"
      - "v3/experiments/README.md"
      - "v3/README.md"
      - "v3/STATUS.md"
      - ".github/workflows/exp006_pr_validation.yml"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: fear-greed-exp006-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_exp006:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run EXP-006 unit tests
        run: python -m unittest -v v3.tests.test_exp006_opportunity

      - name: Build frozen baseline dataset
        run: |
          python -m v3.features.build_features
          python -m v3.labels.build_labels
          python -m v3.evaluation.validate_dataset

      - name: Reconstruct retained Treasury dataset
        run: python -m v3.ci.run_treasury_feature_stage

      - name: Run pre-registered EXP-006 evaluation
        run: python -m v3.evaluation.exp006_opportunity

      - name: Verify committed EXP-006 evidence reproduces exactly
        run: |
          git diff --exit-code -- \
            v3/reports/exp006_evaluation.json \
            v3/reports/exp006_metrics.csv \
            v3/reports/exp006_state_distribution.csv
          python -m v3.ci.check_exp006_evidence

      - name: Verify frozen v2.1 benchmark
        run: |
          python -m v3.baseline.freeze_v2_1
          git diff --exit-code -- reports/baseline_v2_1/

      - name: Upload EXP-006 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp006-evidence-${{ github.run_id }}
          path: |
            v3/reports/exp006_evaluation.json
            v3/reports/exp006_metrics.csv
            v3/reports/exp006_state_distribution.csv
            v3/reports/exp006_predictions.parquet
            v3/experiments/EXP-006/PLAN.md
            v3/experiments/EXP-006/manifest.json
            v3/checkpoints/EXP-006.md
          if-no-files-found: warn
          retention-days: 90
