name: Update Fear and Greed SPX Dataset

run-name: Update Fear and Greed SPX Dataset

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - Update Daily Fear and Greed CSV
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fear-greed-spx-dataset
  cancel-in-progress: false

jobs:
  update-market-data:
    name: Update analysis-ready SPX dataset and signal ledger

    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run market and ledger tests
        run: |
          python -m unittest -v \
            test_fear_greed_market_data.py \
            test_signal_ledger.py

      - name: Build Fear and Greed SPX dataset
        run: |
          python FearGreedMarketData.py \
            --fear-greed-input data/fear_greed_daily.csv \
            --spx-cache data/spx_daily.csv \
            --output data/fear_greed_spx_daily.csv \
            --json

      - name: Record immutable decision and mature old outcomes
        run: |
          python scripts/signal_ledger.py \
            --config config.json \
            --manifest strategy_manifest.json \
            --ledger data/signal_ledger.csv

      - name: Commit changed datasets and ledger
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- \
            data/spx_daily.csv \
            data/fear_greed_spx_daily.csv \
            data/signal_ledger.csv)" ]; then
            echo "Datasets and signal ledger are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/spx_daily.csv \
            data/fear_greed_spx_daily.csv \
            data/signal_ledger.csv

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi

          git commit -m "Update market data and signal ledger"
          git pull --rebase origin main
          git push origin HEAD:main
