name: Validate V3 Pull Requests

on:
  pull_request:
    paths:
      - "v3/**"
      - "reports/baseline_v2_1/**"
      - "requirements.txt"
      - ".github/workflows/v3_pr_validation.yml"

# TEMPORARY V3-013 repair permission. This is reverted to contents: read
# immediately after the branch has one internally generated, hash-consistent
# QQQ/SPY snapshot + manifest commit.
permissions:
  contents: write

concurrency:
  group: fear-greed-v3-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_v3:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out pull-request head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: One-time repair of QQQ/SPY snapshot integrity
        id: repair_snapshot
        shell: bash
        run: |
          set -euo pipefail
          if python - <<'PY'
          import gzip
          import hashlib
          import json
          from pathlib import Path

          snapshot = Path("v3/data/qqq_spy_daily.csv.gz")
          manifest_path = Path("v3/data/qqq_spy_source.json")
          if not snapshot.exists() or not manifest_path.exists():
              raise SystemExit(1)
          try:
              payload = snapshot.read_bytes()
              gzip.decompress(payload)
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if hashlib.sha256(payload).hexdigest() == manifest.get("snapshot_sha256") else 1)
          PY
          then
            echo "Snapshot already valid; no repair needed."
          else
            echo "Snapshot invalid/mismatched; regenerating once inside GitHub."
            python v3/data_sources/fetch_relative_strength.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add v3/data/qqq_spy_daily.csv.gz v3/data/qqq_spy_source.json
            git commit -m "Repair frozen QQQ/SPY snapshot integrity"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            echo "Snapshot repaired and pushed; this run continues against the repaired bytes."
          fi

      - name: Run all v3 unit tests
        run: python -m unittest discover -s v3/tests -p "test_*.py" -v

      - name: Build point-in-time features
        run: python v3/features/build_features.py

      - name: Build executable-entry labels
        run: python v3/labels/build_labels.py

      - name: Validate v3 dataset
        run: python v3/evaluation/validate_dataset.py

      - name: Run current v3 stage checks
        run: |
          if [ -f v3/ci/run_current_stage.py ]; then
            python v3/ci/run_current_stage.py
          else
            echo "No current-stage hook yet."
          fi

      - name: Freeze v2.1 baseline for v3 comparison
        run: python v3/baseline/freeze_v2_1.py

      - name: Verify frozen baseline is reproducible
        run: git diff --exit-code -- reports/baseline_v2_1/

      - name: Upload v3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-evidence-${{ github.run_id }}
          path: |
            reports/baseline_v2_1/
            v3/reports/
            v3/data/
          if-no-files-found: error
          retention-days: 90
