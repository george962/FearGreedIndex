name: Bootstrap V3 Integrity Repair

on:
  push:
    branches:
      - agent/v3-integrity-repair
    paths:
      - ".github/workflows/v3_integrity_repair_bootstrap.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/agent/v3-integrity-repair'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/v3-integrity-repair
          fetch-depth: 0

      - name: Restore exact V3-013 assets and remove stale finalizers
        run: |
          set -euo pipefail
          git fetch origin agent/v3-013-relative-strength
          git checkout origin/agent/v3-013-relative-strength -- \
            v3/data/qqq_spy_daily.csv.gz \
            v3/data/qqq_spy_source.json \
            v3/data_sources/fetch_relative_strength.py \
            v3/evaluation/relative_strength_ablation.py \
            v3/features/build_relative_strength_features.py \
            v3/features/relative_strength_features.json \
            v3/reports/relative_strength_ablation.json \
            v3/reports/relative_strength_ablation_lane_summary.csv \
            v3/reports/relative_strength_ablation_tournament.csv \
            v3/tests/test_relative_strength_ablation.py \
            v3/tests/test_relative_strength_features.py

          rm -f \
            .github/workflows/v3_dollar_finalize.yml \
            .github/workflows/v3_policy_finalize.yml \
            .github/workflows/v3_retained_combined_finalize.yml \
            .github/workflows/v3_sizing_finalize.yml \
            .github/workflows/v3_treasury_finalize.yml

          rm -f .github/workflows/v3_integrity_repair_bootstrap.yml

      - name: Commit repaired repository state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair missing V3-013 assets and remove stale finalizers"
          git push origin HEAD:agent/v3-integrity-repair
