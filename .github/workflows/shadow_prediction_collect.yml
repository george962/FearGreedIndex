name: Collect V3 Shadow Predictions

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Collect Untouched Forward Evidence
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/shadow_prediction_collect.yml"
      - "v3/evidence/shadow_predictions.py"
      - "v3/tests/test_shadow_predictions.py"
      - "v3/reports/stab004_evaluation.json"
      - "v3/methodology/STAB-004/manifest.json"
      - "v3/evaluation/stab001_past_only.py"
      - "v3/evaluation/stab003_consensus_abstention.py"
      - "v3/evaluation/stab004_rolling_normalization.py"

permissions:
  contents: write

concurrency:
  group: fear-greed-shadow-predictions
  cancel-in-progress: false

jobs:
  collect-shadow-predictions:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record generation commit
        shell: bash
        run: echo "GENERATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run shadow-ledger unit tests
        run: python -m unittest -v v3.tests.test_shadow_predictions

      - name: Reconstruct frozen V3 Treasury dataset
        run: |
          python -m v3.features.build_features
          python -m v3.labels.build_labels
          python -m v3.evaluation.validate_dataset
          python -m v3.ci.run_treasury_feature_stage

      - name: Verify untouched feature evidence remains sealed
        run: python -m v3.evidence.verify_forward_lane

      - name: Append missing shadow predictions
        run: python -m v3.evidence.shadow_predictions collect

      - name: Verify immutable shadow prediction lane
        run: python -m v3.evidence.shadow_predictions verify

      - name: Commit only shadow prediction ledger if main is unchanged
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- v3/evidence/shadow_prediction_ledger.csv; then
            echo "Shadow prediction ledger is already current."
            exit 0
          fi

          git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"
          LOCAL_SHA="$(git rev-parse HEAD)"
          if [ "$LOCAL_SHA" != "$GENERATION_SHA" ] || [ "$REMOTE_SHA" != "$GENERATION_SHA" ]; then
            echo "main changed during shadow prediction generation; refusing to publish stale predictions"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/evidence/shadow_prediction_ledger.csv

          if git diff --cached --quiet; then
            echo "No shadow prediction changes to commit."
            exit 0
          fi

          git commit -m "Append immutable V3 shadow predictions"
          git push origin HEAD:main
