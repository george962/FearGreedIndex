name: Update Daily Fear and Greed CSV

run-name: Update Daily Fear and Greed CSV

on:
  push:
    branches:
      - main
    paths:
      - FearGreedHistory.py
      - .github/workflows/history.yml

  workflow_dispatch:

  schedule:
    # 7:45 PM EDT / 6:45 PM EST, Monday-Friday.
    # GitHub cron schedules use UTC.
    - cron: "45 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fear-greed-daily-history
  cancel-in-progress: false

jobs:
  update-history:
    name: Update daily CSV history
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          pip install certifi

      - name: Update daily history
        run: |
          python FearGreedHistory.py \
            --start-date 2021-02-01 \
            --output data/fear_greed_daily.csv

      - name: Commit changed CSV
        run: |
          set -euo pipefail

          if git diff --quiet -- data/fear_greed_daily.csv; then
            echo "Daily CSV is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fear_greed_daily.csv
          git commit -m "Update daily Fear and Greed history"
          git pull --rebase origin main
          git push origin HEAD:main
