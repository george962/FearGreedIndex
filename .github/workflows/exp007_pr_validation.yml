name: Validate EXP-007 Rate Regime

on:
  pull_request:
    paths:
      - "v3/evaluation/exp007_rate_regime.py"
      - "v3/ci/check_exp007_evidence.py"
      - "v3/tests/test_exp007_rate_regime.py"
      - "v3/experiments/EXP-007/**"
      - "v3/checkpoints/EXP-007.md"
      - "v3/reports/exp007_evaluation.json"
      - "v3/reports/exp007_metrics.csv"
      - "v3/reports/exp007_regime_diagnostics.csv"
      - "v3/STATUS.md"
      - ".github/workflows/exp007_pr_validation.yml"

permissions:
  contents: read

concurrency:
  group: fear-greed-exp007-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_exp007:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run EXP-006 and EXP-007 unit tests
        run: |
          python -m unittest -v \
            v3.tests.test_exp006_opportunity \
            v3.tests.test_exp007_rate_regime

      - name: Build frozen baseline dataset
        run: |
          python -m v3.features.build_features
          python -m v3.labels.build_labels
          python -m v3.evaluation.validate_dataset

      - name: Reconstruct retained Treasury dataset
        run: python -m v3.ci.run_treasury_feature_stage

      - name: Reproduce frozen EXP-006 samples
        run: python -m v3.evaluation.exp006_opportunity

      - name: Run pre-registered EXP-007 evaluation
        run: python -m v3.evaluation.exp007_rate_regime

      - name: Verify committed EXP-007 evidence reproduces exactly
        run: |
          git diff --exit-code -- \
            v3/reports/exp007_evaluation.json \
            v3/reports/exp007_metrics.csv \
            v3/reports/exp007_regime_diagnostics.csv
          python -m v3.ci.check_exp007_evidence

      - name: Verify frozen v2.1 benchmark
        run: |
          python -m v3.baseline.freeze_v2_1
          git diff --exit-code -- reports/baseline_v2_1/

      - name: Upload EXP-007 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp007-evidence-${{ github.run_id }}
          path: |
            v3/reports/exp007_evaluation.json
            v3/reports/exp007_metrics.csv
            v3/reports/exp007_regime_diagnostics.csv
            v3/reports/exp007_predictions.parquet
            v3/experiments/EXP-007/PLAN.md
            v3/experiments/EXP-007/manifest.json
            v3/checkpoints/EXP-007.md
          if-no-files-found: warn
          retention-days: 90
