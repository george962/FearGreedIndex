name: Validate ADAPT-001 Long-Short Consensus

on:
  pull_request:
    paths:
      - "v3/evaluation/adapt001_long_short_consensus.py"
      - "v3/tests/test_adapt001_long_short_consensus.py"
      - "v3/methodology/ADAPT-001/**"
      - "v3/reports/adapt001_*"
      - "v3/checkpoints/ADAPT-001.md"
      - "v3/evaluation/stab001_past_only.py"
      - "v3/ci/check_stab001_evidence.py"
      - "v3/methodology/STAB-001/**"
      - "v3/reports/stab001_*"
      - "v3/evaluation/stab002_causal_calibration.py"
      - "v3/ci/check_stab002_evidence.py"
      - "v3/methodology/STAB-002/**"
      - "v3/reports/stab002_*"
      - "v3/evaluation/exp006_opportunity.py"
      - "v3/experiments/EXP-006/**"
      - "v3/evidence/**"
      - "v3/features/**"
      - "v3/labels/**"
      - "v3/models/common.py"
      - "config.json"
      - "requirements.txt"
      - ".github/workflows/adapt001_pr_validation.yml"

permissions:
  contents: read

concurrency:
  group: fear-greed-adapt001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_adapt001:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run adaptive-methodology unit tests
        run: |
          python -m unittest -v \
            v3.tests.test_exp006_opportunity \
            v3.tests.test_stab001_past_only \
            v3.tests.test_stab002_causal_calibration \
            v3.tests.test_adapt001_long_short_consensus

      - name: Build frozen baseline dataset
        run: |
          python -m v3.features.build_features
          python -m v3.labels.build_labels
          python -m v3.evaluation.validate_dataset

      - name: Reconstruct retained Treasury dataset
        run: python -m v3.ci.run_treasury_feature_stage

      - name: Reproduce frozen EXP-006 samples
        run: python -m v3.evaluation.exp006_opportunity

      - name: Reproduce frozen STAB-001 evidence
        run: |
          python -m v3.evaluation.stab001_past_only
          python -m v3.ci.check_stab001_evidence

      - name: Reproduce frozen STAB-002 evidence
        run: |
          python -m v3.evaluation.stab002_causal_calibration
          python -m v3.ci.check_stab002_evidence

      - name: Run pre-registered ADAPT-001 evaluation
        run: python -m v3.evaluation.adapt001_long_short_consensus

      - name: Verify EVID-001 remains sealed
        run: python -m v3.evidence.verify_forward_lane

      - name: Verify frozen v2.1 benchmark
        run: |
          python -m v3.baseline.freeze_v2_1
          git diff --exit-code -- reports/baseline_v2_1/

      - name: Upload ADAPT-001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adapt001-evidence-${{ github.run_id }}
          path: |
            v3/reports/adapt001_evaluation.json
            v3/reports/adapt001_metrics.csv
            v3/reports/adapt001_daily.csv
            v3/methodology/ADAPT-001/PLAN.md
            v3/methodology/ADAPT-001/manifest.json
          if-no-files-found: warn
          retention-days: 90
