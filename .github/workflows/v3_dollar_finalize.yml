name: Finalize V3 Dollar Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/v3_dollar_finalize.yml"
      - "v3/evaluation/dollar_ablation.py"
      - "v3/tests/test_dollar_ablation.py"

permissions:
  contents: write

concurrency:
  group: fear-greed-v3-dollar-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run dollar tests
        run: python -m unittest discover -s v3/tests -p "test_dollar_*.py" -v
      - name: Build and validate frozen dollar data
        run: python v3/ci/run_dollar_feature_stage.py
      - name: Run frozen dollar ablation
        run: python v3/evaluation/dollar_ablation.py
      - name: Verify frozen v2.1 benchmark
        run: |
          python v3/baseline/freeze_v2_1.py
          git diff --exit-code -- reports/baseline_v2_1/
      - name: Create measured decision marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("v3/reports/dollar_ablation.json").read_text())
          decision = report["feature_family_decision"]
          keep = bool(decision["retain_dollar"])
          marker = Path("v3/reports/dollar_result_KEEP.txt" if keep else "v3/reports/dollar_result_REJECT.txt")
          opposite = Path("v3/reports/dollar_result_REJECT.txt" if keep else "v3/reports/dollar_result_KEEP.txt")
          if opposite.exists(): opposite.unlink()
          marker.write_text("\n".join([
              f"decision={decision['decision']}",
              f"robust_lane_count={decision['robust_lane_count']}",
              f"sample_hashes_match={report['sample_hashes_match']}",
              f"best_ranked_full_candidate={report['best_ranked_full_candidate_in_ablation_tournament']}",
              f"promotion_ready={report['promotion_ready_experiments_from_absolute_gates']}",
              f"ablation_as_of={report['ablation_as_of']}",
          ]) + "\n", encoding="utf-8")
          print(marker.read_text())
          PY
      - name: Commit snapshot/evidence and self-remove
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            v3/data/dollar_daily.csv \
            v3/data/dollar_source.json \
            v3/reports/feature_registry_dollar.json \
            v3/reports/dollar_features_missingness.json \
            v3/reports/dataset_validation_dollar.json \
            v3/reports/dollar_ablation.json \
            v3/reports/dollar_ablation_comparison.csv \
            v3/reports/dollar_ablation_lane_summary.csv \
            v3/reports/dollar_ablation_tournament.csv \
            v3/reports/dollar_result_*.txt
          git rm .github/workflows/v3_dollar_finalize.yml
          git commit -m "Preserve V3-015B dollar ablation evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
