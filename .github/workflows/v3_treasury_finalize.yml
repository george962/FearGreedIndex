name: Finalize V3 Treasury Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/v3_treasury_finalize.yml"
      - "v3/evaluation/treasury_ablation.py"
      - "v3/tests/test_treasury_ablation.py"
      - "v3/data/treasury_daily.csv"
      - "v3/data/treasury_source.json"

permissions:
  contents: write

concurrency:
  group: fear-greed-v3-treasury-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Treasury unit tests
        run: python -m unittest discover -s v3/tests -p "test_treasury_*.py" -v

      - name: Build and validate frozen Treasury feature family
        run: python v3/ci/run_treasury_feature_stage.py

      - name: Run fixed-as-of Treasury ablation
        run: python v3/evaluation/treasury_ablation.py

      - name: Verify frozen v2.1 benchmark remains unchanged
        run: |
          python v3/baseline/freeze_v2_1.py
          git diff --exit-code -- reports/baseline_v2_1/

      - name: Create result marker from measured evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("v3/reports/treasury_ablation.json").read_text())
          decision = report["feature_family_decision"]
          keep = bool(decision["retain_treasury"])
          marker = Path(
              "v3/reports/treasury_result_KEEP.txt"
              if keep
              else "v3/reports/treasury_result_REJECT.txt"
          )
          opposite = Path(
              "v3/reports/treasury_result_REJECT.txt"
              if keep
              else "v3/reports/treasury_result_KEEP.txt"
          )
          if opposite.exists():
              opposite.unlink()
          marker.write_text(
              "\n".join(
                  [
                      f"decision={decision['decision']}",
                      f"robust_lane_count={decision['robust_lane_count']}",
                      f"sample_hashes_match={report['sample_hashes_match']}",
                      f"best_ranked_full_candidate={report['best_ranked_full_candidate_in_ablation_tournament']}",
                      f"promotion_ready={report['promotion_ready_experiments_from_absolute_gates']}",
                      f"ablation_as_of={report['ablation_as_of']}",
                  ]
              ) + "\n",
              encoding="utf-8",
          )
          print(marker.read_text())
          PY

      - name: Commit immutable Treasury evidence and remove finalizer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            v3/data/treasury_daily.csv \
            v3/data/treasury_source.json \
            v3/reports/feature_registry_treasury.json \
            v3/reports/treasury_features_missingness.json \
            v3/reports/dataset_validation_treasury.json \
            v3/reports/treasury_ablation.json \
            v3/reports/treasury_ablation_comparison.csv \
            v3/reports/treasury_ablation_lane_summary.csv \
            v3/reports/treasury_ablation_tournament.csv \
            v3/reports/treasury_result_*.txt
          git rm .github/workflows/v3_treasury_finalize.yml
          git commit -m "Preserve V3-015A Treasury ablation evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
