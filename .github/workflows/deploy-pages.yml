name: Deploy Fear & Greed Dashboard

run-name: >-
  Deploy Fear & Greed Dashboard —
  ${{ github.event_name == 'workflow_dispatch' && 'manual run'
      || github.event_name == 'schedule' && 'scheduled update'
      || format('push by {0}', github.actor) }}

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "config.json"
      - "requirements.txt"
      - "data/fear_greed.tsv"
      - "scripts/build_dashboard.py"
      - "scripts/update_fear_greed.py"

  workflow_dispatch:

  schedule:
    - cron: "30 23 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fear-greed-dashboard-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build dashboard website
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify required dashboard files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "requirements.txt"
            "config.json"
            "data/fear_greed.tsv"
            "scripts/build_dashboard.py"
            "scripts/update_fear_greed.py"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required file is missing: $file"
              exit 1
            fi
          done

          echo "All required dashboard files are present."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Optionally refresh Fear & Greed data
        env:
          FEAR_GREED_SOURCE_URL: ${{ secrets.FEAR_GREED_SOURCE_URL }}
        run: python scripts/update_fear_greed.py

      - name: Generate static dashboard
        run: python scripts/build_dashboard.py

      - name: Verify generated website
        shell: bash
        run: |
          set -euo pipefail

          required_site_files=(
            "site/index.html"
            "site/styles.css"
            "site/app.js"
            "site/version.json"
            "site/analysis.json"
          )

          for file in "${required_site_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Generated site file is missing: $file"
              exit 1
            fi
          done

          echo "Generated website files:"
          find site -maxdepth 2 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    name: Publish dashboard to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4