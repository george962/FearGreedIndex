name: Validate EXP-009 Recent Window

on:
  pull_request:
    paths:
      - "v3/evaluation/exp009_recent_window.py"
      - "v3/tests/test_exp009_recent_window.py"
      - "v3/ci/check_exp009_evidence.py"
      - "v3/experiments/EXP-009/**"
      - "v3/checkpoints/EXP-009.md"
      - "v3/reports/exp009_evaluation.json"
      - "v3/reports/exp009_metrics.csv"
      - ".github/workflows/exp009_pr_validation.yml"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: fear-greed-exp009-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_exp009:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run EXP-006 and EXP-009 unit tests
        run: |
          python -m unittest -v \
            v3.tests.test_exp006_opportunity \
            v3.tests.test_exp009_recent_window

      - name: Build frozen baseline dataset
        run: |
          python -m v3.features.build_features
          python -m v3.labels.build_labels
          python -m v3.evaluation.validate_dataset

      - name: Reconstruct retained Treasury dataset
        run: python -m v3.ci.run_treasury_feature_stage

      - name: Reproduce frozen EXP-006 samples
        run: python -m v3.evaluation.exp006_opportunity

      - name: Run pre-registered EXP-009 evaluation
        run: python -m v3.evaluation.exp009_recent_window

      - name: Verify committed EXP-009 evidence semantically reproduces
        run: python -m v3.ci.check_exp009_evidence

      - name: Verify frozen v2.1 benchmark
        run: |
          python -m v3.baseline.freeze_v2_1
          git diff --exit-code -- reports/baseline_v2_1/

      - name: Upload EXP-009 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp009-evidence-${{ github.run_id }}
          path: |
            v3/reports/exp009_evaluation.json
            v3/reports/exp009_metrics.csv
            v3/reports/exp009_predictions.parquet
            v3/experiments/EXP-009/PLAN.md
            v3/experiments/EXP-009/manifest.json
            v3/checkpoints/EXP-009.md
          if-no-files-found: warn
          retention-days: 90
