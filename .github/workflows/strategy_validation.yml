name: Validate Fear and Greed Strategy

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "v3/**"
      - "reports/baseline_v2_1/**"
      - "requirements.txt"
      - ".github/workflows/strategy_validation.yml"

  push:
    branches:
      - main
    paths:
      - "backtest.py"
      - "config.json"
      - "strategy_manifest.json"
      - "scripts/build_dashboard.py"
      - "scripts/research_common.py"
      - "scripts/strategy_validation.py"
      - "scripts/signal_ledger.py"
      - "test_strategy_validation.py"
      - "test_signal_ledger.py"
      - "test_backtest.py"
      - "test_http_retry.py"
      - "v3/**"
      - "reports/baseline_v2_1/**"
      - "requirements.txt"
      - ".github/workflows/strategy_validation.yml"

  schedule:
    - cron: "15 14 * * 6"

permissions:
  contents: read

concurrency:
  group: fear-greed-strategy-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_v2_1:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current ref
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run all strategy tests
        run: |
          python -m unittest -v \
            test_feargreed.py \
            test_fear_greed_market_data.py \
            test_dashboard.py \
            test_backtest.py \
            test_http_retry.py \
            test_strategy_validation.py \
            test_signal_ledger.py

      - name: Run anchored walk-forward validation
        id: walk_forward
        continue-on-error: true
        run: |
          python scripts/strategy_validation.py \
            --config config.json \
            --manifest strategy_manifest.json \
            --output-dir reports \
            --strict

      - name: Run unified backtest
        run: |
          python backtest.py \
            --config config.json \
            --manifest strategy_manifest.json \
            --output-dir reports

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feargreed-validation-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce validation gate
        if: steps.walk_forward.outcome == 'failure'
        run: |
          echo "Frozen walk-forward acceptance checks did not pass."
          exit 1

  validate_v3_foundation:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current ref
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run v3 foundation unit tests
        run: |
          python -m unittest -v \
            v3.tests.test_features \
            v3.tests.test_labels \
            v3.tests.test_leakage

      - name: Build point-in-time features
        run: python v3/features/build_features.py

      - name: Build executable-entry labels
        run: python v3/labels/build_labels.py

      - name: Validate v3 dataset
        run: python v3/evaluation/validate_dataset.py

      - name: Freeze v2.1 baseline for v3 comparison
        run: python v3/baseline/freeze_v2_1.py

      - name: Upload v3 foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-foundation-evidence-${{ github.run_id }}
          path: |
            reports/baseline_v2_1/
            v3/reports/
            v3/data/
          if-no-files-found: error
          retention-days: 90
