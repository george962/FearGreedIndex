name: Deploy Fear & Greed Dashboard

run-name: >-
  Deploy Fear & Greed Dashboard —
  ${{ github.event_name == 'workflow_dispatch' && 'manual run'
      || github.event_name == 'workflow_run' && 'upstream evidence/data workflow completed'
      || format('push by {0}', github.actor) }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "config.json"
      - "requirements.txt"
      - "scripts/build_dashboard.py"
      - "scripts/build_v3_challenger.py"
      - "test_feargreed.py"
      - "test_fear_greed_market_data.py"
      - "test_dashboard.py"
      - "test_v3_challenger.py"
      - "v3/evidence/forward_feature_ledger.csv"
      - "v3/evidence/forward_checkpoints.json"
      - "v3/evidence/shadow_prediction_ledger.csv"
      - "v3/evidence/shadow_predictions.py"
      - "v3/tests/test_shadow_predictions.py"
      - "v3/features/**"
      - "v3/labels/**"
      - "v3/reports/feature_registry_treasury.json"
      - "v3/reports/stab004_evaluation.json"
      - "v3/methodology/STAB-004/manifest.json"
      - "v3/evaluation/stab001_past_only.py"
      - "v3/evaluation/stab003_consensus_abstention.py"
      - "v3/evaluation/stab004_rolling_normalization.py"
      - "v3/ci/run_treasury_feature_stage.py"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update Fear and Greed SPX Dataset
      - Collect Untouched Forward Evidence
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fear-greed-dashboard-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build dashboard website
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "requirements.txt"
            "config.json"
            "data/fear_greed_daily.csv"
            "data/spx_daily.csv"
            "scripts/build_dashboard.py"
            "scripts/build_v3_challenger.py"
            "v3/evidence/forward_feature_ledger.csv"
            "v3/evidence/shadow_prediction_ledger.csv"
            "v3/evidence/shadow_predictions.py"
            "v3/reports/stab004_evaluation.json"
          )
          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "::error file=$file::Missing $file"; exit 1; }
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run repository tests
        run: |
          python -m unittest -v \
            test_feargreed.py \
            test_fear_greed_market_data.py \
            test_dashboard.py \
            test_v3_challenger.py \
            v3.tests.test_shadow_predictions

      - name: Generate static dashboard
        run: python scripts/build_dashboard.py

      - name: Reconstruct frozen V3 Treasury dataset
        run: |
          python -m v3.features.build_features
          python -m v3.labels.build_labels
          python -m v3.evaluation.validate_dataset
          python -m v3.ci.run_treasury_feature_stage

      - name: Verify EVID-001 remains sealed
        run: python -m v3.evidence.verify_forward_lane

      - name: Verify immutable V3 shadow predictions
        run: python -m v3.evidence.shadow_predictions verify

      - name: Add research-only V3 challenger
        run: python scripts/build_v3_challenger.py

      - name: Verify generated website
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            site/index.html \
            site/styles.css \
            site/app.js \
            site/version.json \
            site/analysis.json \
            site/v3_challenger.json \
            site/v3_challenger_history.csv; do
            test -f "$file" || { echo "::error file=$file::Missing generated file"; exit 1; }
          done
          grep -q 'id="v3-research-challenger"' site/index.html
          grep -q 'IMMUTABLE SHADOW MODE' site/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("site/v3_challenger.json").read_text())
          assert payload["mode"] == "RESEARCH_ONLY"
          assert payload["production_effect"] == "NONE"
          assert payload["guardrails"]["production_action_changed"] is False
          assert payload["guardrails"]["sizing_multiplier"] == 1.0
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    name: Publish dashboard to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
