name: Validate STAB-001 Past-Only Stability

on:
  pull_request:
    paths:
      - "v3/evaluation/stab001_past_only.py"
      - "v3/tests/test_stab001_past_only.py"
      - "v3/methodology/**"
      - "v3/reports/stab001_*"
      - "v3/checkpoints/STAB-001.md"
      - "v3/evaluation/exp006_opportunity.py"
      - "v3/experiments/EXP-006/**"
      - "v3/features/**"
      - "v3/labels/**"
      - "v3/models/common.py"
      - "config.json"
      - "requirements.txt"
      - ".github/workflows/stab001_pr_validation.yml"

permissions:
  contents: read

concurrency:
  group: fear-greed-stab001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_stab001:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run STAB-001 and target-contract tests
        run: |
          python -m unittest -v \
            v3.tests.test_exp006_opportunity \
            v3.tests.test_stab001_past_only

      - name: Build frozen baseline dataset
        run: |
          python -m v3.features.build_features
          python -m v3.labels.build_labels
          python -m v3.evaluation.validate_dataset

      - name: Reconstruct retained Treasury dataset
        run: python -m v3.ci.run_treasury_feature_stage

      - name: Reproduce frozen EXP-006 samples
        run: python -m v3.evaluation.exp006_opportunity

      - name: Run pre-registered STAB-001 evaluation
        run: python -m v3.evaluation.stab001_past_only

      - name: Verify EVID-001 remains sealed
        run: |
          python -m v3.evidence.verify_forward_lane
          test "$(wc -l < v3/evidence/forward_checkpoints.json)" -gt 0

      - name: Verify frozen v2.1 benchmark
        run: |
          python -m v3.baseline.freeze_v2_1
          git diff --exit-code -- reports/baseline_v2_1/

      - name: Upload STAB-001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stab001-evidence-${{ github.run_id }}
          path: |
            v3/reports/stab001_evaluation.json
            v3/reports/stab001_metrics.csv
            v3/reports/stab001_selected_features.csv
            v3/methodology/STAB-001/PLAN.md
            v3/methodology/STAB-001/manifest.json
          if-no-files-found: warn
          retention-days: 90
