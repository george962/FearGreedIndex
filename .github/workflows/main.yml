name: CNN Fear and Greed Monitor

run-name: Check CNN Fear and Greed Index

on:
  workflow_dispatch:

  schedule:
    # Runs daily at 8:17 AM UTC.
    - cron: "17 8 * * *"

permissions:
  contents: read
  issues: write

jobs:
  check-fear-and-greed:
    name: Check Fear and Greed Index
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get Fear and Greed Index
        id: feargreed
        run: |
          python FearGreed.py \
            --github-output \
            --low 50 \
            --high 75

      - name: Show result
        run: |
          echo "Date: ${{ steps.feargreed.outputs.date }}"
          echo "Value: ${{ steps.feargreed.outputs.value }}"
          echo "Rating: ${{ steps.feargreed.outputs.rating }}"
          echo "Alert: ${{ steps.feargreed.outputs.alert_type }}"

      # ---------------------------------------------------------
      # LOW ALERT
      # ---------------------------------------------------------

      - name: Find permanent low alert issue
        if: steps.feargreed.outputs.alert_type == 'low'
        id: low-issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_DATA="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state all \
              --search '"Fear & Greed LOW Alert" in:title' \
              --json number,title,state \
              --jq '
                map(
                  select(.title == "Fear & Greed LOW Alert")
                )[0] // {}
              '
          )"

          ISSUE_NUMBER="$(
            echo "$ISSUE_DATA" |
            jq -r '.number // ""'
          )"

          ISSUE_STATE="$(
            echo "$ISSUE_DATA" |
            jq -r '.state // ""'
          )"

          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "state=$ISSUE_STATE" >> "$GITHUB_OUTPUT"

      - name: Create permanent low alert issue
        if: >-
          steps.feargreed.outputs.alert_type == 'low' &&
          steps.low-issue.outputs.number == ''
        id: create-low
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_URL="$(
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Fear & Greed LOW Alert" \
              --assignee "george962" \
              --body "$(cat <<'EOF'
          This is the permanent issue for low CNN Fear & Greed alerts.

          New low readings will be added here as comments. The issue may be
          closed when the index returns to normal and reopened when another
          low alert occurs.
          EOF
          )"
          )"

          ISSUE_NUMBER="${ISSUE_URL##*/}"
          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Reopen permanent low alert issue
        if: >-
          steps.feargreed.outputs.alert_type == 'low' &&
          steps.low-issue.outputs.number != '' &&
          steps.low-issue.outputs.state == 'CLOSED'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.low-issue.outputs.number }}
        run: |
          gh issue reopen "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "A new low Fear & Greed alert has been triggered."

      - name: Add current low alert reading
        if: steps.feargreed.outputs.alert_type == 'low'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXISTING_NUMBER: ${{ steps.low-issue.outputs.number }}
          CREATED_NUMBER: ${{ steps.create-low.outputs.number }}
          CURRENT_VALUE: ${{ steps.feargreed.outputs.value }}
          CURRENT_RATING: ${{ steps.feargreed.outputs.rating }}
          CURRENT_DATE: ${{ steps.feargreed.outputs.date }}
        run: |
          ISSUE_NUMBER="$EXISTING_NUMBER"

          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_NUMBER="$CREATED_NUMBER"
          fi

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$(cat <<EOF
          ## Low alert triggered

          - **Current value:** $CURRENT_VALUE
          - **Rating:** $CURRENT_RATING
          - **Data date:** $CURRENT_DATE
          - **Low threshold:** 50

          The CNN Fear & Greed Index is at or below the configured low threshold.
          EOF
          )"

      # ---------------------------------------------------------
      # HIGH ALERT
      # ---------------------------------------------------------

      - name: Find permanent high alert issue
        if: steps.feargreed.outputs.alert_type == 'high'
        id: high-issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_DATA="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state all \
              --search '"Fear & Greed HIGH Alert" in:title' \
              --json number,title,state \
              --jq '
                map(
                  select(.title == "Fear & Greed HIGH Alert")
                )[0] // {}
              '
          )"

          ISSUE_NUMBER="$(
            echo "$ISSUE_DATA" |
            jq -r '.number // ""'
          )"

          ISSUE_STATE="$(
            echo "$ISSUE_DATA" |
            jq -r '.state // ""'
          )"

          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "state=$ISSUE_STATE" >> "$GITHUB_OUTPUT"

      - name: Create permanent high alert issue
        if: >-
          steps.feargreed.outputs.alert_type == 'high' &&
          steps.high-issue.outputs.number == ''
        id: create-high
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_URL="$(
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Fear & Greed HIGH Alert" \
              --assignee "george962" \
              --body "$(cat <<'EOF'
          This is the permanent issue for high CNN Fear & Greed alerts.

          New high readings will be added here as comments. The issue may be
          closed when the index returns to normal and reopened when another
          high alert occurs.
          EOF
          )"
          )"

          ISSUE_NUMBER="${ISSUE_URL##*/}"
          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Reopen permanent high alert issue
        if: >-
          steps.feargreed.outputs.alert_type == 'high' &&
          steps.high-issue.outputs.number != '' &&
          steps.high-issue.outputs.state == 'CLOSED'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.high-issue.outputs.number }}
        run: |
          gh issue reopen "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "A new high Fear & Greed alert has been triggered."

      - name: Add current high alert reading
        if: steps.feargreed.outputs.alert_type == 'high'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXISTING_NUMBER: ${{ steps.high-issue.outputs.number }}
          CREATED_NUMBER: ${{ steps.create-high.outputs.number }}
          CURRENT_VALUE: ${{ steps.feargreed.outputs.value }}
          CURRENT_RATING: ${{ steps.feargreed.outputs.rating }}
          CURRENT_DATE: ${{ steps.feargreed.outputs.date }}
        run: |
          ISSUE_NUMBER="$EXISTING_NUMBER"

          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_NUMBER="$CREATED_NUMBER"
          fi

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$(cat <<EOF
          ## High alert triggered

          - **Current value:** $CURRENT_VALUE
          - **Rating:** $CURRENT_RATING
          - **Data date:** $CURRENT_DATE
          - **High threshold:** 75

          The CNN Fear & Greed Index is at or above the configured high threshold.
          EOF
          )"

      # ---------------------------------------------------------
      # NORMAL RANGE
      # ---------------------------------------------------------

      - name: Close alert issues after returning to normal
        if: steps.feargreed.outputs.alert_type == 'normal'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_VALUE: ${{ steps.feargreed.outputs.value }}
          CURRENT_RATING: ${{ steps.feargreed.outputs.rating }}
          CURRENT_DATE: ${{ steps.feargreed.outputs.date }}
        run: |
          LOW_ISSUE="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search '"Fear & Greed LOW Alert" in:title' \
              --json number,title \
              --jq '
                map(
                  select(.title == "Fear & Greed LOW Alert")
                )[0].number // ""
              '
          )"

          if [ -n "$LOW_ISSUE" ]; then
            gh issue close "$LOW_ISSUE" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "$(cat <<EOF
          Index returned to the normal range.

          - **Current value:** $CURRENT_VALUE
          - **Rating:** $CURRENT_RATING
          - **Data date:** $CURRENT_DATE
          EOF
          )"
          fi

          HIGH_ISSUE="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search '"Fear & Greed HIGH Alert" in:title' \
              --json number,title \
              --jq '
                map(
                  select(.title == "Fear & Greed HIGH Alert")
                )[0].number // ""
              '
          )"

          if [ -n "$HIGH_ISSUE" ]; then
            gh issue close "$HIGH_ISSUE" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "$(cat <<EOF
          Index returned to the normal range.

          - **Current value:** $CURRENT_VALUE
          - **Rating:** $CURRENT_RATING
          - **Data date:** $CURRENT_DATE
          EOF
          )"
          fi