name: Finalize STAB-002 Evidence

on:
  push:
    branches:
      - agent/stab-002-causal-calibration
    paths:
      - ".github/workflows/stab002_finalize.yml"

permissions:
  contents: write

concurrency:
  group: fear-greed-stab002-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
        with:
          ref: agent/stab-002-causal-calibration
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Rebuild frozen result
        run: |
          python -m v3.features.build_features
          python -m v3.labels.build_labels
          python -m v3.evaluation.validate_dataset
          python -m v3.ci.run_treasury_feature_stage
          python -m v3.evaluation.exp006_opportunity
          python -m v3.evaluation.stab001_past_only
          python -m v3.ci.check_stab001_evidence
          python -m v3.evaluation.stab002_causal_calibration
      - name: Freeze manifest checkpoint and status
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          manifest_path = root/'v3/methodology/STAB-002/manifest.json'
          eval_path = root/'v3/reports/stab002_evaluation.json'
          metrics_path = root/'v3/reports/stab002_metrics.csv'
          inner_path = root/'v3/reports/stab002_inner_calibration.csv'
          checkpoint = root/'v3/checkpoints/STAB-002.md'
          status_path = root/'v3/STATUS.md'
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          result = json.loads(eval_path.read_text())
          manifest = json.loads(manifest_path.read_text())
          manifest['status'] = 'complete_reject'
          manifest['result'] = {'decision': result['decision'], 'method_viability_pass': result['method_viability_pass'], **result['viability']}
          manifest['evidence'] = {
            'v3/reports/stab002_evaluation.json': sha(eval_path),
            'v3/reports/stab002_metrics.csv': sha(metrics_path),
            'v3/reports/stab002_inner_calibration.csv': sha(inner_path),
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True)+'\n')
          v = result['viability']
          checkpoint.write_text(f'''# STAB-002 — Nested causal calibration\n\n## Result\n\n**REJECT — `{result['decision']}`**\n\nCausal Platt calibration substantially improved the raw STAB-001 probability calibration, but it could not establish a stable forward orientation or beat the legal training base-rate predictor.\n\n- mean ROC AUC: **{v['mean_roc_auc']:.6f}**\n- positive AUC folds: **{v['positive_auc_folds']}/3**\n- positive Platt-slope folds: **{v['positive_platt_slope_folds']}/3**\n- mean relative Brier improvement: **{v['mean_relative_brier_improvement']:.6f}**\n- positive relative-Brier folds: **{v['positive_relative_brier_folds']}/3**\n- mean ECE: **{v['mean_expected_calibration_error']:.6f}** vs raw STAB-001 **{v['raw_stab001_mean_expected_calibration_error']:.6f}**\n- Brier better than raw STAB-001: **{v['brier_better_than_raw_stab001_folds']}/3 folds**, aggregate **{v['aggregate_brier_better_than_raw_stab001']}**\n- exact STAB-001 sample hashes matched: **{v['sample_hashes_match_stab001']}**\n\nThe fitted slope was negative in 2024 and 2026 YTD. STAB-002 correctly failed closed to the training base rate in those folds rather than reversing the score after the fact. Only 2025 had a positive calibration slope, and even there relative Brier was negative.\n\n## Interpretation\n\nThe problem is no longer just probability mapping. The **orientation of the score-to-outcome relationship itself changes**. Do not retune the calibration window, block count, C, or model under STAB-002. The next methodology should test causal drift/consensus gating or acquire more independent historical regimes; it should not force a prediction when long- and short-memory relationships disagree.\n\n2024–2026 YTD remain development evidence only. EVID-001 outcomes were not opened. No champion, V3-019, policy, or sizing state changed.\n''')
          status = status_path.read_text()
          anchor = '| STAB-001 Past-only relationship stability selection | COMPLETE — REJECT / RANKING PROMISING | issue #62 / PR #63; mean AUC ~0.573 and AUC >0.50 in 3/3 folds, but relative Brier <0 in 3/3 folds |'
          row = '| STAB-002 Nested causal calibration | COMPLETE — REJECT | issue #64 / PR #65; ECE improved materially, but positive calibration slope only 1/3 folds and relative Brier remained negative |'
          if row not in status:
              status = status.replace(anchor, anchor+'\n'+row)
          status = status.replace(
              '3. STAB-001 is frozen as a negative experiment with promising ranking but failed calibration. Pre-register a separate causal calibration methodology before any adaptive predictive model; do not retune STAB-001.',
              '3. STAB-001 and STAB-002 are frozen. Ranking improved, but causal score orientation/calibration still drift. Next test a pre-registered long-memory/short-memory consensus and abstention methodology; do not retune either stability experiment.'
          )
          status_path.write_text(status)
          PY
      - name: Commit immutable evidence and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f v3/reports/stab002_evaluation.json v3/reports/stab002_metrics.csv v3/reports/stab002_inner_calibration.csv
          git add v3/methodology/STAB-002/manifest.json v3/checkpoints/STAB-002.md v3/STATUS.md
          git rm .github/workflows/stab002_finalize.yml
          git commit -m "Freeze STAB-002 negative evidence"
          git push origin HEAD:agent/stab-002-causal-calibration
