name: Deploy Fear & Greed Dashboard

run-name: >-
  Deploy Fear & Greed Dashboard —
  ${{ github.event_name == 'workflow_dispatch' && 'manual run'
      || github.event_name == 'workflow_run' && 'dataset workflow completed'
      || format('push by {0}', github.actor) }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "config.json"
      - "requirements.txt"
      - "scripts/build_dashboard.py"
      - "test_feargreed.py"
      - "test_fear_greed_market_data.py"
      - "test_dashboard.py"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update Fear and Greed SPX Dataset
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fear-greed-dashboard-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build dashboard website
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "requirements.txt"
            "config.json"
            "data/fear_greed_daily.csv"
            "data/spx_daily.csv"
            "scripts/build_dashboard.py"
          )
          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "::error file=$file::Missing $file"; exit 1; }
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run repository tests
        run: python -m unittest -v test_feargreed.py test_fear_greed_market_data.py test_dashboard.py

      - name: Generate static dashboard
        run: python scripts/build_dashboard.py

      - name: Verify generated website
        shell: bash
        run: |
          set -euo pipefail
          for file in site/index.html site/styles.css site/app.js site/version.json site/analysis.json; do
            test -f "$file" || { echo "::error file=$file::Missing generated file"; exit 1; }
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    name: Publish dashboard to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4