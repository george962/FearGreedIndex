name: Validate V3 Pull Requests

on:
  pull_request:
    paths:
      - "v3/**"
      - "reports/baseline_v2_1/**"
      - "requirements.txt"
      - ".github/workflows/v3_pr_validation.yml"

permissions:
  contents: read

concurrency:
  group: fear-greed-v3-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_v3_foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run v3 foundation unit tests
        run: |
          python -m unittest -v \
            v3.tests.test_features \
            v3.tests.test_labels \
            v3.tests.test_leakage

      - name: Build point-in-time features
        run: python v3/features/build_features.py

      - name: Build executable-entry labels
        run: python v3/labels/build_labels.py

      - name: Validate v3 dataset
        run: python v3/evaluation/validate_dataset.py

      - name: Freeze v2.1 baseline for v3 comparison
        run: python v3/baseline/freeze_v2_1.py

      - name: Upload v3 foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-foundation-evidence-${{ github.run_id }}
          path: |
            reports/baseline_v2_1/
            v3/reports/
            v3/data/
          if-no-files-found: error
          retention-days: 90
