name: Validate DIAG-001 Drift Analysis

on:
  pull_request:
    paths:
      - "v3/diagnostics/**"
      - "v3/tests/test_diag001_drift.py"
      - "v3/ci/check_diag001_evidence.py"
      - "v3/checkpoints/DIAG-001.md"
      - "v3/reports/diag001_*.csv"
      - "v3/reports/diag001_summary.json"
      - "v3/STATUS.md"
      - "v3/README.md"
      - ".github/workflows/diag001_pr_validation.yml"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: fear-greed-diag001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_diag001:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run DIAG-001 unit tests
        run: python -m unittest -v v3.tests.test_diag001_drift

      - name: Build frozen baseline dataset
        run: |
          python -m v3.features.build_features
          python -m v3.labels.build_labels
          python -m v3.evaluation.validate_dataset

      - name: Reconstruct retained Treasury dataset
        run: python -m v3.ci.run_treasury_feature_stage

      - name: Run DIAG-001 drift analysis
        run: python -m v3.diagnostics.diag001_drift

      - name: Verify committed DIAG-001 evidence semantically reproduces
        run: python -m v3.ci.check_diag001_evidence

      - name: Verify frozen v2.1 benchmark
        run: |
          python -m v3.baseline.freeze_v2_1
          git diff --exit-code -- reports/baseline_v2_1/

      - name: Upload DIAG-001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag001-evidence-${{ github.run_id }}
          path: |
            v3/reports/diag001_target_drift.csv
            v3/reports/diag001_feature_drift.csv
            v3/reports/diag001_feature_target_association.csv
            v3/reports/diag001_feature_stability.csv
            v3/reports/diag001_summary.json
            v3/diagnostics/diag001_manifest.json
            v3/checkpoints/DIAG-001.md
          if-no-files-found: warn
          retention-days: 90
