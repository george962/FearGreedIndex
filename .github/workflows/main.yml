name: CNN Fear and Greed Monitor

run-name: Check CNN Fear and Greed Index

on:
  workflow_dispatch:

  schedule:
    # Runs daily at 8:17 AM UTC.
    - cron: "17 8 * * *"

permissions:
  contents: read
  issues: write

jobs:
  check-fear-and-greed:
    name: Check Fear and Greed Index
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get Fear and Greed Index
        id: feargreed
        run: |
          python FearGreed.py \
            --github-output \
            --low 50 \
            --high 75

      - name: Show result
        run: |
          echo "Date: ${{ steps.feargreed.outputs.date }}"
          echo "Value: ${{ steps.feargreed.outputs.value }}"
          echo "Rating: ${{ steps.feargreed.outputs.rating }}"
          echo "Alert: ${{ steps.feargreed.outputs.alert_type }}"

      - name: Check for existing low alert
        if: steps.feargreed.outputs.alert_type == 'low'
        id: existing-low
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search '"Fear & Greed LOW Alert:" in:title' \
              --json number \
              --jq '.[0].number // ""'
          )"

          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Create low alert issue
        if: >-
          steps.feargreed.outputs.alert_type == 'low' &&
          steps.existing-low.outputs.issue_number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ steps.feargreed.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.feargreed.outputs.issue_body }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$ISSUE_TITLE" \
            --body "$ISSUE_BODY" \
            --assignee "george962"

      - name: Update existing low alert
        if: >-
          steps.feargreed.outputs.alert_type == 'low' &&
          steps.existing-low.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.existing-low.outputs.issue_number }}
          CURRENT_VALUE: ${{ steps.feargreed.outputs.value }}
          CURRENT_RATING: ${{ steps.feargreed.outputs.rating }}
          CURRENT_DATE: ${{ steps.feargreed.outputs.date }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Still in the low range: **$CURRENT_VALUE** ($CURRENT_RATING) on $CURRENT_DATE."

      - name: Check for existing high alert
        if: steps.feargreed.outputs.alert_type == 'high'
        id: existing-high
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search '"Fear & Greed HIGH Alert:" in:title' \
              --json number \
              --jq '.[0].number // ""'
          )"

          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Create high alert issue
        if: >-
          steps.feargreed.outputs.alert_type == 'high' &&
          steps.existing-high.outputs.issue_number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ steps.feargreed.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.feargreed.outputs.issue_body }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$ISSUE_TITLE" \
            --body "$ISSUE_BODY" \
            --assignee "george962"

      - name: Update existing high alert
        if: >-
          steps.feargreed.outputs.alert_type == 'high' &&
          steps.existing-high.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.existing-high.outputs.issue_number }}
          CURRENT_VALUE: ${{ steps.feargreed.outputs.value }}
          CURRENT_RATING: ${{ steps.feargreed.outputs.rating }}
          CURRENT_DATE: ${{ steps.feargreed.outputs.date }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Still in the high range: **$CURRENT_VALUE** ($CURRENT_RATING) on $CURRENT_DATE."

      - name: Close old alert issues after returning to normal
        if: steps.feargreed.outputs.alert_type == 'normal'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_VALUE: ${{ steps.feargreed.outputs.value }}
          CURRENT_DATE: ${{ steps.feargreed.outputs.date }}
        run: |
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search '"Fear & Greed LOW Alert:" in:title' \
            --json number \
            --jq '.[].number' |
          while read -r ISSUE_NUMBER; do
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue close "$ISSUE_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "Index returned to the normal range at **$CURRENT_VALUE** on $CURRENT_DATE."
            fi
          done

          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search '"Fear & Greed HIGH Alert:" in:title' \
            --json number \
            --jq '.[].number' |
          while read -r ISSUE_NUMBER; do
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue close "$ISSUE_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "Index returned to the normal range at **$CURRENT_VALUE** on $CURRENT_DATE."
            fi
          done