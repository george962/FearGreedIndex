name: Validate STAB-003 Consensus Abstention

on:
  pull_request:
    paths:
      - "v3/evaluation/stab003_consensus_abstention.py"
      - "v3/tests/test_stab003_consensus_abstention.py"
      - "v3/ci/check_stab003_evidence.py"
      - "v3/methodology/STAB-003/**"
      - "v3/reports/stab003_*"
      - "v3/checkpoints/STAB-003.md"
      - "v3/evaluation/stab001_past_only.py"
      - "v3/ci/check_stab001_evidence.py"
      - "v3/methodology/STAB-001/**"
      - "v3/reports/stab001_*"
      - "v3/ci/check_stab002_evidence.py"
      - "v3/evaluation/exp006_opportunity.py"
      - "v3/experiments/EXP-006/**"
      - "v3/evidence/**"
      - "v3/features/**"
      - "v3/labels/**"
      - "v3/models/common.py"
      - "config.json"
      - "requirements.txt"
      - ".github/workflows/stab003_pr_validation.yml"

permissions:
  contents: read

concurrency:
  group: fear-greed-stab003-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_stab003:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run STAB-003 unit tests
        run: |
          python -m unittest -v \
            v3.tests.test_exp006_opportunity \
            v3.tests.test_stab001_past_only \
            v3.tests.test_stab003_consensus_abstention

      - name: Build frozen baseline dataset
        run: |
          python -m v3.features.build_features
          python -m v3.labels.build_labels
          python -m v3.evaluation.validate_dataset

      - name: Reconstruct retained Treasury dataset
        run: python -m v3.ci.run_treasury_feature_stage

      - name: Reproduce frozen EXP-006 samples
        run: python -m v3.evaluation.exp006_opportunity

      - name: Reproduce frozen STAB-001 ranking evidence
        run: |
          python -m v3.evaluation.stab001_past_only
          python -m v3.ci.check_stab001_evidence

      - name: Verify EVID-001 remains sealed
        run: python -m v3.evidence.verify_forward_lane

      - name: Reproduce frozen STAB-003 evaluation
        run: python -m v3.evaluation.stab003_consensus_abstention

      - name: Verify immutable STAB-003 evidence semantically reproduces
        run: python -m v3.ci.check_stab003_evidence

      - name: Print STAB-003 fold evidence
        shell: bash
        run: |
          cat v3/reports/stab003_metrics.csv
          cat v3/reports/stab003_consensus_features.csv

      - name: Verify frozen v2.1 benchmark
        run: |
          python -m v3.baseline.freeze_v2_1
          git diff --exit-code -- reports/baseline_v2_1/

      - name: Upload STAB-003 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stab003-evidence-${{ github.run_id }}
          path: |
            v3/reports/stab003_evaluation.json
            v3/reports/stab003_metrics.csv
            v3/reports/stab003_consensus_features.csv
            v3/methodology/STAB-003/PLAN.md
            v3/methodology/STAB-003/manifest.json
            v3/checkpoints/STAB-003.md
          if-no-files-found: warn
          retention-days: 90
