name: Validate EVID-001 Forward Evidence

on:
  pull_request:
    paths:
      - "v3/evidence/**"
      - "v3/tests/test_forward_evidence.py"
      - "v3/features/build_features.py"
      - "v3/features/build_treasury_features.py"
      - "v3/features/feature_registry.json"
      - "v3/features/treasury_features.json"
      - "v3/reports/feature_registry_treasury.json"
      - "v3/data/treasury_daily.csv"
      - "v3/data_sources/fetch_treasury.py"
      - "data/fear_greed_daily.csv"
      - "data/spx_daily.csv"
      - "requirements.txt"
      - ".github/workflows/evid001_pr_validation.yml"
      - ".github/workflows/forward_evidence_collect.yml"

permissions:
  contents: read

concurrency:
  group: fear-greed-evid001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_evid001:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run forward-evidence unit tests
        run: python -m unittest -v v3.tests.test_forward_evidence

      - name: Rebuild point-in-time research features
        run: |
          python -m v3.features.build_features
          python -m v3.ci.run_treasury_feature_stage

      - name: Verify sealed forward lane without network access
        run: python -m v3.evidence.verify_forward_lane

      - name: Verify no outcome vocabulary entered ledger header
        shell: bash
        run: |
          set -euo pipefail
          header="$(head -n 1 v3/evidence/forward_feature_ledger.csv)"
          if echo "$header" | grep -Eqi 'forward_|max_drawdown|further_5pct_decline|known_date|realized_return|realized_pnl|realized_performance|outcome|target|label'; then
            echo "Forbidden outcome-like column found in forward ledger"
            exit 1
          fi

      - name: Verify frozen v2.1 benchmark
        run: |
          python -m v3.baseline.freeze_v2_1
          git diff --exit-code -- reports/baseline_v2_1/
